<html lang="en">
<head>

<title>Sunny Side Up</title>
<meta name="theme-color" content="#EEF4F0" media="(prefers-color-scheme: light)">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-17 -17 34 34'%3E%3Cpath d='M16.6 0.0 L16.3 3.7 L14.1 6.8 L11.3 9.0 L8.7 10.9 L6.0 12.5 L3.0 13.2 L0.0 12.9 L-2.9 12.7 L-6.2 13.0 L-10.2 12.8 L-13.6 10.8 L-14.8 7.1 L-13.8 3.2 L-12.4 0.0 L-12.0 -2.7 L-12.1 -5.8 L-11.4 -9.1 L-9.4 -11.7 L-6.5 -13.6 L-3.4 -15.1 L-0.0 -16.1 L3.6 -15.6 L6.3 -13.2 L7.9 -9.9 L9.1 -7.3 L11.3 -5.5 L14.4 -3.3Z' fill='%23fff' stroke='%232B2B2B' stroke-width='2.5'/%3E%3Ccircle cx='1' cy='-1' r='7' fill='%23FFA51F' stroke='%232B2B2B' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Calm and simple, after drip: flat white surfaces on a soft mint-grey page, one accent (yolk orange), the egg as logo. */
:root{
  --paper:#EEF4F0; --card:#FFFFFF; --ink:#26262B; --muted:#6B6E75; --line:#E1E8E3;
  --yolk:#FFA51F; --yolk-ink:#9A5800; --mint:#8FEACF; --pink:#FF5FAE;
  --street:#FFD84D; --shade:#B9B0EE; --building:#4A4A55; --building-tall:#36363F; --land:#E6ECE8; --water:#6EC3F0;
  --display:"Bagel Fat One", "Cooper Black", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#18181A; --card:#232326; --ink:#F2F2EF; --muted:#A9A9A4; --line:#313135;
  --yolk:#FFAE2E; --yolk-ink:#FFC56B; --mint:#5FD9B6; --pink:#FF6FB8;
  --street:#C9A531; --shade:#2F2D33; --building:#6E6E7A; --building-tall:#5C5C67; --land:#202023; --water:#2F7FB0;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#18181A; --card:#232326; --ink:#F2F2EF; --muted:#A9A9A4; --line:#313135;
  --yolk:#FFAE2E; --yolk-ink:#FFC56B; --mint:#5FD9B6; --pink:#FF6FB8;
  --street:#C9A531; --shade:#2F2D33; --building:#6E6E7A; --building-tall:#5C5C67; --land:#202023; --water:#2F7FB0;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;margin:0;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--yolk);outline-offset:2px}
.app{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}

/* header: egg + name, district jump on the right */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-top:4px}
header h1{min-width:0}
.sunpath{flex:none;display:flex;flex-direction:column;align-items:flex-end}
.sunpath svg{display:block;width:132px;height:auto;overflow:visible}
.readout{font-size:.8rem;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,8vw,2.1rem);line-height:.95;margin:0 0 6px;text-wrap:balance}
.jump{position:relative;align-self:flex-start}
.jump select{appearance:none;-webkit-appearance:none;border:0;background:var(--card);border-radius:999px;padding:8px 30px 8px 13px;font-weight:600;font-size:.88rem;cursor:pointer;min-width:9em}
.jump::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;margin-top:-5px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);pointer-events:none}

/* layout */
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
.mapwrap{position:relative;height:clamp(300px,52svh,560px);border-radius:18px;overflow:hidden;background:var(--land);touch-action:none}
@media (min-width:880px){ .main{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
  .mapwrap{grid-row:1 / span 2;position:sticky;top:12px;height:calc(100svh - 96px);max-height:760px} }
canvas{display:block;width:100%;height:100%}
.maptag{position:absolute;left:10px;bottom:10px;font-size:.8rem;font-weight:600;background:var(--card);border-radius:999px;padding:4px 10px;pointer-events:none;color:var(--muted)}
.compass{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;pointer-events:none}
.compass path{fill:var(--yolk)}
.notice{position:absolute;left:10px;top:10px;right:56px;font-size:.88rem;font-weight:500;background:var(--card);border-radius:12px;padding:8px 11px}

/* time */
.time{background:var(--card);border-radius:18px;padding:12px 14px 10px}
.row{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.seg{border:0;background:transparent;border-radius:999px;padding:7px 12px;font-weight:600;font-size:.92rem;cursor:pointer;color:var(--muted)}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.datebtn{position:relative;display:inline-flex;align-items:center;gap:5px;padding:7px 10px}
.datebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;cursor:pointer}
.datebtn[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.timebig{font-weight:700;font-size:1.45rem;color:var(--ink);line-height:1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;margin:6px 0 0;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:var(--line)}
input[type=range]::-moz-range-track{height:6px;border-radius:999px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-9px;border-radius:50%;background:var(--yolk);border:3px solid var(--card);box-shadow:0 1px 3px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--yolk);border:3px solid var(--card)}
.scale{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.scale span:first-child,.scale span:last-child{min-width:3.5em}
.scale span:last-child{text-align:right}

/* list */
.listwrap{display:flex;flex-direction:column;gap:8px}
.area{font-size:.85rem;color:var(--muted);padding:0 4px}
.listhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 4px}
.listhead b{font-size:1.15rem;font-weight:700}
.listhead span{font-size:.85rem;color:var(--muted);white-space:nowrap}
.rows{background:var(--card);border-radius:18px;overflow:hidden}
.item{display:grid;grid-template-columns:12px minmax(0,1fr) auto;column-gap:12px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;cursor:pointer;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.dot{width:12px;height:12px;border-radius:50%;background:var(--mint)}
.item.sun .dot{background:var(--yolk)}
.item.part .dot{background:conic-gradient(var(--yolk) 0 50%,var(--mint) 0)}
.who{min-width:0}
.name{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addr{display:block;font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{font-size:.88rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.item.sun .status{color:var(--yolk-ink);font-weight:600}
.more-info{grid-column:2 / span 2;display:none;margin-top:10px}
.item.sel{background:color-mix(in srgb,var(--yolk) 9%,var(--card))}
.item.sel .more-info{display:block}
.strip{display:block;position:relative;height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.strip canvas{position:absolute;inset:0}
.meta{display:block;font-size:.85rem;color:var(--muted);margin-top:6px}
.more{align-self:center;border:0;background:var(--card);border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer}
.hint{margin:0;padding:12px 14px;background:var(--card);border-radius:18px;color:var(--muted);font-size:.95rem}
footer{font-size:.78rem;color:var(--muted);line-height:1.5;max-width:68ch;padding:0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Sunny Side Up</h1>
    <div class="sunpath" aria-hidden="true">
      <svg viewBox="0 -16 150 90">
        <path d="M10 66 A65 56 0 0 1 140 66" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="1.5 6" stroke-linecap="round" opacity=".7"/>
        <line x1="2" y1="66" x2="148" y2="66" stroke="var(--line)" stroke-width="2.5" stroke-linecap="round"/>
        <g id="egg" transform="translate(75 10) scale(1.3)"><path d="M16.6 0.0 L16.3 3.7 L14.1 6.8 L11.3 9.0 L8.7 10.9 L6.0 12.5 L3.0 13.2 L0.0 12.9 L-2.9 12.7 L-6.2 13.0 L-10.2 12.8 L-13.6 10.8 L-14.8 7.1 L-13.8 3.2 L-12.4 0.0 L-12.0 -2.7 L-12.1 -5.8 L-11.4 -9.1 L-9.4 -11.7 L-6.5 -13.6 L-3.4 -15.1 L-0.0 -16.1 L3.6 -15.6 L6.3 -13.2 L7.9 -9.9 L9.1 -7.3 L11.3 -5.5 L14.4 -3.3Z" fill="#fff" stroke="#2B2B2B" stroke-width="2" stroke-linejoin="round"/><circle cx="1" cy="-1" r="7" fill="var(--yolk)" stroke="#2B2B2B" stroke-width="2"/><ellipse cx="-1.4" cy="-3.4" rx="2.2" ry="1.4" fill="#fff" opacity=".9"/></g>
      </svg>
      <div class="readout" id="readout"></div>
    </div>
  </header>
  <label class="jump"><select id="district" aria-label="Jump to a district"></select></label>

  <div class="main">
    <div class="mapwrap" id="mapwrap">
      <canvas id="map" aria-label="Map with building shadows and terraces"></canvas>
      <div class="compass" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 30 30"><path d="M15 3 L19 15 L15 13 L11 15 Z"/><path d="M15 27 L11 15 L15 17 L19 15 Z" opacity=".35"/></svg></div>
      <div class="notice" id="notice" hidden></div>
      <div class="maptag" id="maptag">Loading …</div>
    </div>

    <div class="time">
      <div class="row">
        <button class="seg" id="btnNow" type="button">Now</button>
        <button class="seg" id="btnToday" type="button" aria-pressed="false">Today</button>
        <button class="seg" id="btnTomorrow" type="button" aria-pressed="false">Tomorrow</button>
        <span class="seg datebtn" id="dateBtn"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span id="dateLabel"></span><input type="date" id="date" aria-label="Pick a date"></span>
      </div>
      <input type="range" id="time" min="0" max="1439" step="5" aria-label="Time of day">
      <div class="scale"><span id="riseLbl"></span><span class="timebig" id="timebig">--:--</span><span id="setLbl"></span></div>
    </div>

    <div class="listwrap">
      <div class="area" id="sub">Schanigärten in the sun, Wien</div>
      <div class="list" id="list" aria-live="polite"></div>
    </div>
  </div>

  <footer id="footer">Buildings and roof heights: Stadt Wien Baukörpermodell. Terraces: Stadt Wien approved Schanigärten. Venue names, streets and water © OpenStreetMap contributors; names may be out of date. Trees, awnings and umbrellas are not modelled.</footer>
</div>

<script>
/* ---------- one map for all of Vienna: overview from city.json, buildings loaded per district as you zoom in ---------- */
const DATA = 'data/';
const EYE = 1.2, CELL = 25, MAXREACH = 600, LIST_STEP = 40;
const NEAR = 0.32;            // px per metre: from here on buildings, shade and sun are shown
const LON0 = 16.3725, LAT0 = 48.2083, KX = Math.cos(LAT0*Math.PI/180)*111320, KY = 110540;
const toXY = (lon,lat) => [(lon-LON0)*KX, (lat-LAT0)*KY];
const ck = (cx,cy) => (cx+50000)*100000 + (cy+50000);
let B = [], GRID = new Map(), MAXROOF = 0, seenB = new Int32Array(0), stamp = 0;
const BKEYS = new Set();
let TERRACES = [], BYID = new Map(), STREETS = [], WATER = [], RIVERS = [], DISTRICTS = [];
const CHUNKS = new Map();     // district -> 'loading' | 'ready'

/* ---------- geometry ---------- */
function inside(px,py,pts){ let c=false; for(let i=0,j=pts.length-1;i<pts.length;j=i++){ const [xi,yi]=pts[i],[xj,yj]=pts[j];
  if(((yi>py)!==(yj>py)) && (px < (xj-xi)*(py-yi)/(yj-yi)+xi)) c=!c; } return c; }
function insideAny(x,y){ const l=GRID.get(ck(Math.floor(x/CELL),Math.floor(y/CELL))); if(!l) return null; for(const i of l){ const b=B[i]; if(x<b.x0||x>b.x1||y<b.y0||y>b.y1) continue; if(inside(x,y,b.pts)) return b; } return null; }
function nearestEdge(x,y,pts){ let best=null,bd=1e9; for(let i=0,j=pts.length-1;i<pts.length;j=i++){ const [ax,ay]=pts[j],[bx,by]=pts[i];
  const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy||1; let t=((x-ax)*dx+(y-ay)*dy)/L; t=Math.max(0,Math.min(1,t)); const qx=ax+t*dx,qy=ay+t*dy,d=Math.hypot(x-qx,y-qy);
  if(d<bd){bd=d;best=[qx,qy];} } return best; }
function groundAt(x,y){
  const cx=Math.floor(x/CELL), cy=Math.floor(y/CELL); let best=null,bd=1e9;
  for(let r=0;r<=6 && !best;r++) for(let i=-r;i<=r;i++) for(let j=-r;j<=r;j++){ if(Math.max(Math.abs(i),Math.abs(j))!==r) continue;
    const l=GRID.get(ck(cx+i,cy+j)); if(!l) continue;
    for(const k of l){ const b=B[k]; const d=Math.hypot(Math.max(b.x0-x,0,x-b.x1),Math.max(b.y0-y,0,y-b.y1)); if(d<bd){bd=d;best=b;} } }
  return best?best.base:38;
}
function bboxOf(pts){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const [x,y] of pts){ if(x<x0)x0=x; if(y<y0)y0=y; if(x>x1)x1=x; if(y>y1)y1=y; } return {x0,y0,x1,y1}; }

function loadCity(city){
  TERRACES = city.terraces.map(t0 => { const t={...t0, gid:t0.d*10000+t0.id}; [t.x,t.y]=toXY(t.lon,t.lat); t.ready=false; return t; });
  BYID = new Map(TERRACES.map(t=>[t.gid,t]));
  const w = city.water || {};
  WATER = (w.areas||[]).map(rings => { const rs=rings.map(r=>r.map(([lo,la])=>toXY(lo,la))); return {rings:rs, ...bboxOf(rs[0])}; });
  RIVERS = (w.lines||[]).map(l => { const pts=l.map(([lo,la])=>toXY(lo,la)); return {pts, ...bboxOf(pts)}; });
}
function prepTerrace(t){
  let [x,y] = toXY(t.lon,t.lat);
  const hit = insideAny(x,y);
  if (hit){ const [qx,qy]=nearestEdge(x,y,hit.pts); const dx=qx-x,dy=qy-y,d=Math.hypot(dx,dy)||1; x=qx+dx/d*1.8; y=qy+dy/d*1.8; }
  t.x=x; t.y=y; t.g=groundAt(x,y);
  const r = Math.min(4, Math.max(1.5, Math.sqrt(t.m2||1)/2));
  t.samples = [[0,0],[r,0],[-r,0],[0,r],[0,-r]].map(([dx,dy])=>[x+dx,y+dy]).filter(([sx,sy],i)=> i===0 || !insideAny(sx,sy));
  t.ready = true;
}
function addChunk(d, data){
  for(const b of data.buildings){
    const key=b.o+':'+b.r[0][0]+','+b.r[0][1]; if(BKEYS.has(key)) continue; BKEYS.add(key);   // neighbouring districts overlap at the edges
    const pts = b.r.map(([lo,la]) => toXY(lo,la));
    let a2=0; for(let i=0,j=pts.length-1;i<pts.length;j=i++) a2+=pts[j][0]*pts[i][1]-pts[i][0]*pts[j][1];
    if (a2<0) pts.reverse();
    const bb=bboxOf(pts), idx=B.length;
    for(let cx=Math.floor(bb.x0/CELL);cx<=Math.floor(bb.x1/CELL);cx++) for(let cy=Math.floor(bb.y0/CELL);cy<=Math.floor(bb.y1/CELL);cy++){
      const k=ck(cx,cy); let l=GRID.get(k); if(!l){ l=[]; GRID.set(k,l); } l.push(idx); }
    if (b.o>MAXROOF) MAXROOF=b.o;
    B.push({pts, roof:b.o, base:b.t, h:b.o-b.t, ...bb});
  }
  if (seenB.length<B.length){ const n=new Int32Array(B.length+4096); n.set(seenB); seenB=n; }
  for(const s of data.streets||[]){ const pts=s.l.map(([lo,la])=>toXY(lo,la)); STREETS.push({n:s.n, pts, ...bboxOf(pts)}); }
  const mine = TERRACES.filter(t=>t.d===d);
  for(const t of mine) prepTerrace(t);
  return mine;
}

/* ---------- sun position (after SunCalc, V. Agafonkin) ---------- */
const RAD=Math.PI/180, E=RAD*23.4397;
function sunPos(date, lat, lng){
  const d = date.valueOf()/864e5 - 0.5 + 2440588 - 2451545;
  const M = RAD*(357.5291 + 0.98560028*d);
  const C = RAD*(1.9148*Math.sin(M) + 0.02*Math.sin(2*M) + 0.0003*Math.sin(3*M));
  const L = M + C + RAD*102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(E)*Math.sin(L));
  const ra = Math.atan2(Math.sin(L)*Math.cos(E), Math.cos(L));
  const H = RAD*(280.16 + 360.9856235*d) + RAD*lng - ra;
  const phi = RAD*lat;
  const alt = Math.asin(Math.sin(phi)*Math.sin(dec) + Math.cos(phi)*Math.cos(dec)*Math.cos(H));
  const az = Math.atan2(Math.sin(H), Math.cos(H)*Math.sin(phi) - Math.tan(dec)*Math.cos(phi)) + Math.PI;
  return {alt, az};
}

/* ---------- shadow test: walk grid cells along the ray toward the sun ---------- */
function blocks(b,px,py,dx,dy,tanA,eye){
  const rel = b.roof - eye; if (rel <= 0) return false;
  const reach = rel/tanA;
  if (px < b.x0-reach || px > b.x1+reach || py < b.y0-reach || py > b.y1+reach) return false;
  const pts=b.pts;
  for (let i=0,j=pts.length-1;i<pts.length;j=i++){
    const ax=pts[j][0], ay=pts[j][1], ex=pts[i][0]-ax, ey=pts[i][1]-ay, den = dx*ey - dy*ex;
    if (Math.abs(den)<1e-12) continue;
    const wx=ax-px, wy=ay-py;
    const t = (wx*ey - wy*ex)/den, u = (wx*dy - wy*dx)/den;
    if (t>0.05 && u>=0 && u<=1 && t < reach) return true;
  }
  return false;
}
function litPoint(px,py,g,sun){
  if (sun.alt <= 0.01) return false;
  const dx=Math.sin(sun.az), dy=Math.cos(sun.az), tanA=Math.tan(sun.alt), eye=g+EYE;
  const maxT = Math.min(MAXREACH, (MAXROOF-eye)/tanA);
  if (maxT <= 0) return true;
  if (++stamp > 2e9){ stamp=1; seenB.fill(0); }
  let cx=Math.floor(px/CELL), cy=Math.floor(py/CELL);
  const sX=dx>0?1:-1, sY=dy>0?1:-1;
  const tdX = dx!==0 ? CELL/Math.abs(dx) : Infinity, tdY = dy!==0 ? CELL/Math.abs(dy) : Infinity;
  let tX = dx!==0 ? (dx>0 ? (cx+1)*CELL-px : px-cx*CELL)/Math.abs(dx) : Infinity;
  let tY = dy!==0 ? (dy>0 ? (cy+1)*CELL-py : py-cy*CELL)/Math.abs(dy) : Infinity;
  let t=0;
  while (t <= maxT){
    const l = GRID.get(ck(cx,cy));
    if (l) for (const i of l){ if (seenB[i]===stamp) continue; seenB[i]=stamp; if (blocks(B[i],px,py,dx,dy,tanA,eye)) return false; }
    if (tX < tY){ t=tX; tX+=tdX; cx+=sX; } else { t=tY; tY+=tdY; cy+=sY; }
  }
  return true;
}
function litFraction(t,sun){ let n=0; for(const [x,y] of t.samples) if(litPoint(x,y,t.g,sun)) n++; return n/t.samples.length; }

/* ---------- day timeline, worked out in small slices (nearest terraces first) ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const fmt = m => pad(Math.floor(m/60))+":"+pad(Math.round(m%60));
let day = new Date(); day.setHours(0,0,0,0);
let minute = 0, selected = null, dayCache = null, listLimit = LIST_STEP;
const queue = []; let working = false, lastPaint = 0;

function dateAt(m){ const d=new Date(day); d.setMinutes(m); return d; }
function computeRow(t){
  const st=dayCache.steps, fr=st.map(s=>s.s.alt>0?litFraction(t,s.s):0);
  for(let i=0;i<fr.length;){ if(fr[i]<.5){i++;continue;} let j=i; while(j<fr.length&&fr[j]>=.5) j++;
    if((j-i)*10<20 && st[i].m>=dayCache.set-30) for(let k=i;k<j;k++) fr[k]=0; i=j; }
  return fr;
}
const distToView = t => Math.hypot(t.x-view.cx, t.y-view.cy);
function enqueue(ts){ for(const t of ts) queue.push(t); queue.sort((a,b)=>distToView(a)-distToView(b)); kick(); }
function kick(){ if(working||!queue.length) return; working=true; setTimeout(work,0); }
function work(){
  const t0=performance.now();
  while(queue.length && performance.now()-t0<14){ const t=queue.shift(); if(!dayCache.fr.has(t.gid)) dayCache.fr.set(t.gid, computeRow(t)); }
  if(queue.length){ if(performance.now()-lastPaint>500){ lastPaint=performance.now(); renderList(); draw(); } setTimeout(work,0); }
  else { working=false; renderList(); draw(); }
}
function computeDay(){
  const steps=[]; let rise=null,set=null;
  for (let m=240;m<=1320;m+=10){ const s=sunPos(dateAt(m),LAT0,LON0); steps.push({m,s}); if(s.alt>0&&rise===null) rise=m; if(s.alt>0) set=m; }
  if (rise!==null){ for(let m=rise-10;m<=rise;m++){ if(sunPos(dateAt(m),LAT0,LON0).alt>0){rise=m;break;} } for(let m=set;m<=set+10;m++){ if(sunPos(dateAt(m),LAT0,LON0).alt<=0){set=m;break;} } }
  dayCache = {steps, rise, set, fr:new Map()};
  queue.length=0; enqueue(TERRACES.filter(t=>t.ready));
}
const stepIdx = m => Math.max(0,Math.min(dayCache.steps.length-1,Math.round((m-240)/10)));
function statusFor(t, m){
  const fr = dayCache.fr.get(t.gid);
  const now = t.ready ? litFraction(t, sunPos(dateAt(m),LAT0,LON0)) : 0;
  if (!fr) return {now, fr, cls: now>=.5?"sun":"", text:"…"};
  const st=dayCache.steps, i0=stepIdx(m);
  if (now >= 0.5){ let j=i0; while(j<st.length && fr[j]>=0.5) j++; return {now, fr, cls:"sun", text: j>=st.length||st[j].m>=dayCache.set ? "sun until sunset" : "sun until "+fmt(st[j].m)}; }
  let j=i0; while(j<st.length && fr[j]<0.5) j++;
  if (j>=st.length || st[j].m>=dayCache.set) return {now, fr, cls:"", text: fr.some(f=>f>=0.5) ? "no more sun today" : "no direct sun this day"};
  let k=j; while(k<st.length && fr[k]>=0.5) k++;
  return {now, fr, cls:"", text:"sun "+fmt(st[j].m)+"–"+fmt(st[Math.min(k,st.length-1)].m)};
}

/* ---------- map ---------- */
const cv=$('map'), ctx=cv.getContext('2d'), wrap=$('mapwrap');
const off=document.createElement('canvas'), octx=off.getContext('2d');
let view={cx:0, cy:0, s:0.6}, W=0, H=0, DPR=1, colors={};
function readColors(){ const cs=getComputedStyle(document.documentElement); for(const k of ['yolk','street','building','building-tall','shade','mint','pink','ink','muted','card','paper','land','water']) colors[k]=cs.getPropertyValue('--'+k).trim(); }
function resize(){ const r=wrap.getBoundingClientRect(); DPR=Math.min(2,window.devicePixelRatio||1); W=r.width; H=r.height;
  for(const c of [cv,off]){ c.width=Math.round(W*DPR); c.height=Math.round(H*DPR); } draw(); viewChanged(); }
const sx = x => W/2 + (x-view.cx)*view.s, sy = y => H/2 - (y-view.cy)*view.s;
function viewRect(pad=0){ return {x0:view.cx-W/2/view.s-pad, x1:view.cx+W/2/view.s+pad, y0:view.cy-H/2/view.s-pad, y1:view.cy+H/2/view.s+pad}; }
const meets=(a,v)=>!(a.x1<v.x0||a.x0>v.x1||a.y1<v.y0||a.y0>v.y1);
function addRing(c,pts,ox,oy){ for(let i=0;i<pts.length;i++){ const X=sx(pts[i][0]+ox),Y=sy(pts[i][1]+oy); i?c.lineTo(X,Y):c.moveTo(X,Y); } c.closePath(); }

function drawStreetLabels(v){
  if(view.s<0.6||!STREETS.length) return;
  ctx.fillStyle=colors.ink; ctx.font=`500 ${Math.max(10,Math.min(13,view.s*4.2))}px Figtree,system-ui,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  const placed=[];
  for(const s of STREETS){
    if(!meets(s,v)) continue;
    let best=null, bl=0;
    for(let i=1;i<s.pts.length;i++){ const [ax,ay]=s.pts[i-1],[bx,by]=s.pts[i];
      const mx=(ax+bx)/2, my=(ay+by)/2; if(mx<v.x0||mx>v.x1||my<v.y0||my>v.y1) continue;
      const L=Math.hypot(bx-ax,by-ay)*view.s; if(L>bl){ bl=L; best=[ax,ay,bx,by]; } }
    if(!best) continue;
    const label=s.n, w=ctx.measureText(label).width;
    if(bl<w+16) continue;
    const X=sx((best[0]+best[2])/2), Y=sy((best[1]+best[3])/2);
    if(placed.some(p=>(p.n===s.n&&Math.hypot(p.X-X,p.Y-Y)<260)||Math.hypot(p.X-X,p.Y-Y)<26)) continue;
    let a=Math.atan2(-(best[3]-best[1]),best[2]-best[0]); if(a>Math.PI/2) a-=Math.PI; if(a<-Math.PI/2) a+=Math.PI;
    placed.push({n:s.n,X,Y});
    ctx.save(); ctx.translate(X,Y); ctx.rotate(a); ctx.globalAlpha=.85; ctx.fillText(label,0,0); ctx.restore();
  }
}
function drawWater(v){
  ctx.fillStyle=colors.water;
  for(const w of WATER){ if(!meets(w,v)) continue; ctx.beginPath(); for(const r of w.rings) addRing(ctx,r,0,0); ctx.fill('evenodd'); }
  ctx.strokeStyle=colors.water; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=Math.max(2,Math.min(14,8*view.s));
  for(const r of RIVERS){ if(!meets(r,v)) continue; ctx.beginPath(); r.pts.forEach(([x,y],i)=>i?ctx.lineTo(sx(x),sy(y)):ctx.moveTo(sx(x),sy(y))); ctx.stroke(); }
}
function drawDistrictNames(){
  ctx.font=`600 ${view.s<0.04?12:13}px Figtree,system-ui,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
  const placed=[];
  for(const d of [...DISTRICTS].sort((a,b)=>b.terraces-a.terraces)){ if(!d.c) continue; const X=sx(d.c[0]), Y=sy(d.c[1]);
    const w=ctx.measureText(d.name).width+8, h=18; if(placed.some(p=>Math.abs(p.X-X)<(p.w+w)/2&&Math.abs(p.Y-Y)<h)) continue; placed.push({X,Y,w});
    ctx.lineWidth=4; ctx.lineJoin='round'; ctx.strokeStyle=colors.land; ctx.strokeText(d.name,X,Y); ctx.fillStyle=colors.ink; ctx.fillText(d.name,X,Y); }
}

function draw(){
  if(!W||!dayCache) return;
  const sun = sunPos(dateAt(minute),LAT0,LON0), near = view.s>=NEAR, v=viewRect();
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.fillStyle = near?colors.street:colors.land; ctx.fillRect(0,0,W,H);
  if (near){
    octx.setTransform(DPR,0,0,DPR,0,0); octx.clearRect(0,0,W,H);
    if (sun.alt>0.005){
      const dx=-Math.sin(sun.az), dy=-Math.cos(sun.az), tanA=Math.tan(sun.alt);
      octx.fillStyle=colors.shade;
      for(const b of B){ const L=Math.min(500,b.h/tanA), ox=dx*L, oy=dy*L;
        if(Math.max(b.x1,b.x1+ox)<v.x0||Math.min(b.x0,b.x0+ox)>v.x1||Math.max(b.y1,b.y1+oy)<v.y0||Math.min(b.y0,b.y0+oy)>v.y1) continue;
        const p=b.pts; octx.beginPath(); addRing(octx,p,ox,oy);
        for(let i=0,j=p.length-1;i<p.length;j=i++){ const ax=p[j][0],ay=p[j][1],bx=p[i][0],by=p[i][1];
          const q = (bx-ax)*oy-(by-ay)*ox>0 ? [ax,ay,bx,by,bx+ox,by+oy,ax+ox,ay+oy] : [ax+ox,ay+oy,bx+ox,by+oy,bx,by,ax,ay];
          octx.moveTo(sx(q[0]),sy(q[1])); octx.lineTo(sx(q[2]),sy(q[3])); octx.lineTo(sx(q[4]),sy(q[5])); octx.lineTo(sx(q[6]),sy(q[7])); octx.closePath(); }
        octx.fill('nonzero');
      }
      ctx.drawImage(off,0,0,W,H);
    } else { ctx.globalAlpha=.9; ctx.fillStyle=colors.shade; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  }
  drawWater(v);
  if (near){
    for(const b of B){ if(!meets(b,v)) continue; ctx.beginPath(); addRing(ctx,b.pts,0,0); ctx.fillStyle = b.h>18?colors['building-tall']:colors['building']; ctx.fill(); if(view.s>1.6){ ctx.lineWidth=.8; ctx.strokeStyle=colors.ink; ctx.globalAlpha=.22; ctx.stroke(); ctx.globalAlpha=1; } }
    drawStreetLabels(v);
  }
  // terraces
  const tiny = view.s<0.05, R = near ? Math.max(6,Math.min(11,view.s*2.6)) : tiny ? 2.2 : Math.max(2.8,Math.min(5.5,view.s*14)), m=R/view.s+2, i0=stepIdx(minute);
  const labels=[], vis=[];
  for(const t of TERRACES){ if(t.x<v.x0-m||t.x>v.x1+m||t.y<v.y0-m||t.y>v.y1+m) continue; vis.push(t);
    const fr=dayCache.fr.get(t.gid), known = near ? t.ready : !!fr;
    const f = !known ? null : near ? litFraction(t,sun) : (sun.alt>0 ? fr[i0] : 0);
    const X=sx(t.x), Y=sy(t.y);
    if(selected===t.gid){ ctx.beginPath(); ctx.arc(X,Y,R+5,0,7); ctx.strokeStyle=colors.ink; ctx.lineWidth=3; ctx.stroke(); }
    if(tiny){ ctx.beginPath(); ctx.arc(X,Y,R,0,7); ctx.globalAlpha=f===null?.45:1; ctx.fillStyle=f===null?colors.ink:f>=.5?colors.yolk:colors.mint; ctx.fill(); ctx.globalAlpha=1; continue; }
    ctx.beginPath(); ctx.arc(X,Y,R,0,7); ctx.fillStyle = f===null?colors.muted : f>=.5?colors.yolk:colors.mint; ctx.fill();
    if(f>0&&f<.5){ ctx.beginPath(); ctx.moveTo(X,Y); ctx.arc(X,Y,R,-Math.PI/2,-Math.PI/2+f*2*Math.PI); ctx.closePath(); ctx.fillStyle=colors.yolk; ctx.fill(); }
    ctx.beginPath(); ctx.arc(X,Y,R,0,7); ctx.lineWidth=near?2:1; ctx.strokeStyle=near?'#FFFFFF':colors.card; ctx.stroke();
    if(near && (selected===t.gid||(t.name&&view.s>0.9)||view.s>3.6)) labels.push({t,f:f||0,X,Y,R,sel:selected===t.gid});
  }
  if (!near && view.s<0.12) drawDistrictNames();
  labels.sort((a,b)=>b.sel-a.sel || b.f-a.f);
  const placed=vis.map(t=>{const X=sx(t.x),Y=sy(t.y);return {x:X-R,y:Y-R,w:2*R,h:2*R};}), hits=(r)=>placed.some(p=>r.x<p.x+p.w&&r.x+r.w>p.x&&r.y<p.y+p.h&&r.y+r.h>p.y);
  for(const L of labels){ const sel=L.sel; ctx.font=`${sel?700:600} ${sel?13:12}px Figtree,system-ui,sans-serif`; ctx.textAlign='left'; ctx.textBaseline='middle';
    const label=L.t.name||L.t.addr, w=ctx.measureText(label).width+14, h=22, g=L.R+5;
    const opts=[[L.X+g,L.Y-h/2],[L.X-g-w,L.Y-h/2],[L.X-w/2,L.Y-g-h],[L.X-w/2,L.Y+g]];
    let spot=null; for(const [x,y] of opts){ const r={x,y,w,h}; const fits=x>=4&&y>=4&&x+w<=W-4&&y+h<=H-4; if(fits&&(sel||!hits(r))){ spot=r; break; } }
    if(!spot) continue; placed.push(spot);
    ctx.beginPath(); ctx.roundRect(spot.x,spot.y,w,h,11); ctx.fillStyle=sel?colors.ink:colors.card; ctx.fill();
    ctx.fillStyle=sel?colors.card:colors.ink; ctx.fillText(label,spot.x+7,spot.y+h/2+.5); }
  const rot = sun.alt>0 ? sun.az : null;
  document.querySelector('.compass svg').style.transform = rot===null?'':`rotate(${rot/RAD}deg)`;
  document.querySelector('.compass').style.opacity = rot===null?.4:1;
}

/* ---------- loading buildings for the area in view ---------- */
function ensureChunks(){
  if(view.s<NEAR*0.8) return;
  const v=viewRect(200), need=new Set();   // a terrace's own district file holds every building that can shade it
  for(const t of TERRACES) if(!CHUNKS.has(t.d) && t.x>=v.x0&&t.x<=v.x1&&t.y>=v.y0&&t.y<=v.y1) need.add(t.d);
  for(const d of need) loadChunk(d);
  updateTag();
}
async function loadChunk(d){
  CHUNKS.set(d,'loading'); updateTag();
  try{
    const r=await fetch(`${DATA}districts/${pad(d)}.json`); if(!r.ok) throw new Error(r.status);
    const mine=addChunk(d, await r.json()); CHUNKS.set(d,'ready');
    if(dayCache) enqueue(mine);
  }catch(e){ CHUNKS.delete(d); showNotice("Couldn't load this area. Check your connection and move the map to try again."); }
  updateTag(); draw(); renderList();
}
function updateTag(){
  const loading=[...CHUNKS.values()].includes('loading');
  $('maptag').textContent = loading ? 'Loading buildings …' : view.s<NEAR ? 'Zoom in to see sun and shade' : 'Drag to move, pinch to zoom';
}

/* ---------- pan & zoom ---------- */
const ptrs=new Map(); let last=null, moved=false, vcTimer=null;
function viewChanged(){ clearTimeout(vcTimer); vcTimer=setTimeout(()=>{ ensureChunks(); updateArea(); listLimit=LIST_STEP; renderList(); saveView();
  if(queue.length) queue.sort((a,b)=>distToView(a)-distToView(b)); updateTag(); },180); }
cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,[e.offsetX,e.offsetY]); moved=false; last=null; });
cv.addEventListener('pointermove',e=>{ if(!ptrs.has(e.pointerId)) return; const prev=ptrs.get(e.pointerId); ptrs.set(e.pointerId,[e.offsetX,e.offsetY]);
  if(ptrs.size===1){ const dx=e.offsetX-prev[0], dy=e.offsetY-prev[1]; if(Math.abs(dx)+Math.abs(dy)>1) moved=true; view.cx-=dx/view.s; view.cy+=dy/view.s; draw(); viewChanged(); }
  else if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]); if(last){ zoomAt((a[0]+b[0])/2,(a[1]+b[1])/2,d/last); } last=d; moved=true; } });
const endPtr=e=>{ const wasTap=!moved&&ptrs.size===1; ptrs.delete(e.pointerId); last=null; if(wasTap) tap(e.offsetX,e.offsetY); };
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId); last=null;});
cv.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(e.offsetX,e.offsetY,Math.exp(-e.deltaY*0.0015)); },{passive:false});
cv.addEventListener('dblclick',e=>{ zoomAt(e.offsetX,e.offsetY,2.2); });
function zoomAt(px,py,k){ const ns=Math.max(0.008,Math.min(14,view.s*k)); const wx=view.cx+(px-W/2)/view.s, wy=view.cy-(py-H/2)/view.s; view.s=ns; view.cx=wx-(px-W/2)/ns; view.cy=wy+(py-H/2)/ns; draw(); viewChanged(); }
function tap(px,py){ let best=null,bd=22; const v=viewRect(); for(const t of TERRACES){ if(t.x<v.x0||t.x>v.x1||t.y<v.y0||t.y>v.y1) continue; const d=Math.hypot(sx(t.x)-px,sy(t.y)-py); if(d<bd){bd=d;best=t;} }
  if(best && view.s<NEAR){ view.cx=best.x; view.cy=best.y; view.s=0.9; selected=best.gid; draw(); viewChanged(); return; }   // far out: a tap zooms in there
  selected = best?best.gid:null;
  if(best && !listOrder().slice(0,listLimit).some(r=>r.t.gid===best.gid)) listLimit=1e9;
  renderList(); draw();
  if(best){ const el=document.querySelector(`[data-id="${best.gid}"]`); el&&el.scrollIntoView({block:'nearest',behavior:'smooth'}); } }

/* ---------- list: the terraces on the map, sunniest first ---------- */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function renderStrip(c,fr){ const r=c.parentElement.getBoundingClientRect(); const w=Math.round(r.width*DPR),h=Math.round(r.height*DPR); if(!w) return; c.width=w; c.height=h; const x=c.getContext('2d');
  const a=dayCache.rise??360, z=dayCache.set??1080, span=z-a; x.clearRect(0,0,w,h);
  if(fr) fr.forEach((f,i)=>{ const m=dayCache.steps[i].m; if(m<a||m>z||f<=0) return; x.globalAlpha=f>=.5?1:.5; x.fillStyle=colors.yolk; x.fillRect((m-a)/span*w,0,Math.ceil(10/span*w)+1,h); });
  x.globalAlpha=1; if(minute>=a&&minute<=z){ x.fillStyle=colors.ink; x.fillRect((minute-a)/span*w-1*DPR,0,2*DPR,h); } }
function listOrder(){
  const v=viewRect();
  const rows=TERRACES.filter(t=>t.ready&&t.x>=v.x0&&t.x<=v.x1&&t.y>=v.y0&&t.y<=v.y1).map(t=>{ const s=statusFor(t,minute); return {t,s,total:s.fr?s.fr.filter(f=>f>=.5).length*10:-1}; });
  rows.sort((a,b)=> (b.s.now>=.5)-(a.s.now>=.5) || b.s.now-a.s.now || b.total-a.total);
  return rows;
}
const dur=m=> m>=60? Math.floor(m/60)+' h'+(m%60?' '+m%60+' min':'') : m+' min';
function renderList(){
  if(!dayCache) return;
  const list=$('list');
  if(view.s<NEAR){
    const v=viewRect(), n=TERRACES.filter(t=>t.x>=v.x0&&t.x<=v.x1&&t.y>=v.y0&&t.y<=v.y1).length;
    list.innerHTML=`<div class="listwrap"><div class="listhead"><b>Zoom in to see the sun</b><span>${n} terraces</span></div><p class="hint">Pinch the map, tap a dot, or jump to a district.</p></div>`;
    return;
  }
  const rows=listOrder();
  if(!rows.length){
    const loading=[...CHUNKS.values()].includes('loading');
    list.innerHTML=`<div class="listwrap"><div class="listhead"><b>${loading?'Loading …':'No terraces here'}</b></div>${loading?'':'<p class="hint">Move the map to a street with cafés, or jump to a district.</p>'}</div>`;
    return;
  }
  const sunny=rows.filter(x=>x.s.now>=.5).length, sunUp = sunPos(dateAt(minute),LAT0,LON0).alt>0;
  const pending=rows.filter(x=>!x.s.fr).length;
  let html=`<div class="listwrap"><div class="listhead"><b>${sunUp? (sunny? sunny+" of "+rows.length+" in the sun" : "All in the shade") : "Sun's down"}</b><span>${pending?'working out the day':''}</span></div><div class="rows">`;
  const shown=rows.slice(0,listLimit);
  for(const {t,s,total} of shown){ const cls=s.now>=.5?'sun':(s.now>0?'part':'');
    const daytxt = total<0 ? 'Working out the day' : total? dur(total)+' of sun this day' : 'No direct sun this day';
    const st = sunUp ? s.text[0].toUpperCase()+s.text.slice(1) : (total>0? dur(total)+' sun' : total<0?'…':'No sun');
    html+=`<button class="item ${cls}${selected===t.gid?' sel':''}" data-id="${t.gid}" type="button">
      <span class="dot"></span>
      <span class="who"><span class="name">${esc(t.name||t.addr)}</span>${t.name?`<span class="addr">${esc(t.addr)}</span>`:''}</span>
      <span class="status">${st}</span>
      <span class="more-info"><span class="strip"><canvas></canvas></span><span class="meta">${daytxt}. ${esc(t.kind)}, ${t.m2} m²${t.note?'. '+esc(t.note[0].toUpperCase()+t.note.slice(1)):''}</span></span>
    </button>`; }
  html+=`</div>`;
  if(rows.length>shown.length) html+=`<button class="more" id="more" type="button">Show all ${rows.length}</button>`;
  html+=`</div>`;
  list.innerHTML=html;
  list.querySelectorAll('.item').forEach((el,i)=>{ const t=shown[i].t; if(selected===t.gid) renderStrip(el.querySelector('canvas'),shown[i].s.fr);
    el.addEventListener('click',()=>{ selected = selected===t.gid?null:t.gid; if(selected){ view.cx=t.x; view.cy=t.y; view.s=Math.max(view.s,2.4); viewChanged(); } renderList(); draw(); }); });
  const more=$('more'); if(more) more.onclick=()=>{ listLimit=1e9; renderList(); };
}

/* ---------- where am I: nearest district for the subtitle ---------- */
function updateArea(){
  if(!TERRACES.length) return;
  if(view.s<0.06){ $('sub').textContent='All of Vienna'; return; }
  let best=null,bd=1e18; for(const t of TERRACES){ const d=(t.x-view.cx)**2+(t.y-view.cy)**2; if(d<bd){bd=d;best=t;} }
  const d=DISTRICTS.find(x=>x.d===best.d); if(d) $('sub').textContent=`Around ${d.plz} ${d.name}`;
}

/* ---------- controls ---------- */
function updateReadout(){
  const sp=sunPos(dateAt(minute),LAT0,LON0), dir=['north','north-east','east','south-east','south','south-west','west','north-west'][Math.round(sp.az/RAD/45)%8];
  $('readout').textContent = sp.alt>0 ? `${(sp.alt/RAD).toFixed(0)}° high in the ${dir}` : 'Below the horizon';
  const p=Math.max(0,Math.min(1,(minute-dayCache.rise)/((dayCache.set-dayCache.rise)||1))), th=Math.PI*(1-p), egg=$('egg');
  egg.setAttribute('transform',`translate(${(75+65*Math.cos(th)).toFixed(1)} ${(66-56*Math.sin(th)).toFixed(1)}) scale(1.3) rotate(${(p*40-20).toFixed(0)})`);
  egg.style.opacity = sp.alt>0 ? 1 : .35;
  $('timebig').textContent=fmt(minute);
  const today=new Date(); today.setHours(0,0,0,0); const diff=Math.round((day-today)/864e5);
  $('btnToday').setAttribute('aria-pressed',diff===0); $('btnTomorrow').setAttribute('aria-pressed',diff===1);
  const other=diff!==0&&diff!==1; $('dateBtn').setAttribute('aria-pressed',other);
  $('dateLabel').textContent = other ? day.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}) : '';
  $('date').value=`${day.getFullYear()}-${pad(day.getMonth()+1)}-${pad(day.getDate())}`;
  const sl=$('time'); sl.min=Math.floor((dayCache.rise-30)/5)*5; sl.max=Math.ceil((dayCache.set+30)/5)*5; sl.value=minute;
  $('riseLbl').textContent=fmt(dayCache.rise); $('setLbl').textContent=fmt(dayCache.set);
}
function setDay(d){ day=new Date(d); day.setHours(0,0,0,0); computeDay(); }
function refresh(){ updateReadout(); renderList(); draw(); }
function showNotice(text,ms=6000){ const n=$('notice'); n.textContent=text; n.hidden=false; clearTimeout(showNotice.t); if(ms) showNotice.t=setTimeout(()=>n.hidden=true,ms); }
function goNow(){ const n=new Date(); setDay(n); minute=n.getHours()*60+n.getMinutes();
  if(sunPos(n,LAT0,LON0).alt<=0 || minute>dayCache.set){ const t=new Date(n); if(minute>dayCache.set) t.setDate(t.getDate()+1); setDay(t); minute = Math.round((dayCache.rise+dayCache.set)/2/5)*5; showNotice(n.getHours()>=12 ? "The sun has set. Showing tomorrow at midday." : "The sun isn't up yet. Showing midday."); }
  refresh(); }
$('btnNow').onclick=goNow;
$('btnToday').onclick=()=>{ setDay(new Date()); refresh(); };
$('btnTomorrow').onclick=()=>{ const t=new Date(); t.setDate(t.getDate()+1); setDay(t); refresh(); };
$('date').onchange=e=>{ const v=e.target.value; if(!v) return; const [y,m,d]=v.split('-').map(Number); setDay(new Date(y,m-1,d)); refresh(); };
let raf=null; $('time').oninput=e=>{ minute=+e.target.value; if(raf) return; raf=requestAnimationFrame(()=>{ raf=null; $('timebig').textContent=fmt(minute); updateReadout(); draw(); renderList(); }); };

/* ---------- jump to a district: centre on its busiest café street ---------- */
const store={ get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
function saveView(){ const lon=LON0+view.cx/KX, lat=LAT0+view.cy/KY; store.set('view',JSON.stringify({lon,lat,s:view.s})); }
function jumpTo(d){
  const ts=TERRACES.filter(t=>t.d===d); if(!ts.length) return;
  let best=ts[0], bn=-1;
  for(const a of ts){ let n=0; for(const b of ts) if((a.x-b.x)**2+(a.y-b.y)**2<300*300) n++; if(n>bn){bn=n;best=a;} }
  view.cx=best.x; view.cy=best.y; view.s=0.6; selected=null;
  if(location.hash!=='#'+d) history.replaceState(null,'','#'+d);
  draw(); viewChanged();
}
async function init(){
  readColors();
  let index, city;
  try{
    const [r1,r2]=await Promise.all([fetch(`${DATA}index.json`),fetch(`${DATA}city.json`)]);
    if(!r1.ok||!r2.ok) throw new Error('missing');
    [index, city]=await Promise.all([r1.json(), r2.json()]);
  }catch(e){ showNotice("Couldn't load the map data. The data may not be built yet.",0); return; }
  DISTRICTS = index.districts.map(d=>{ const o={...d};
    if(d.bbox){ const [a,b]=toXY(d.bbox[0],d.bbox[1]), [c,e]=toXY(d.bbox[2],d.bbox[3]); o.bb={x0:a,y0:b,x1:c,y1:e}; o.c=[(a+c)/2,(b+e)/2]; }
    return o; });
  loadCity(city);
  const sel=$('district');
  sel.innerHTML=`<option value="">Districts</option>`+DISTRICTS.map(x=>`<option value="${x.d}">${x.d}. ${esc(x.name)} · ${x.terraces}</option>`).join('');
  sel.onchange=()=>{ const d=+sel.value; sel.value=''; if(d) jumpTo(d); };
  if(index.updated) $('footer').textContent+=` Data from ${index.updated}.`;
  goNow();
  new ResizeObserver(resize).observe(wrap);
  const hashD=parseInt(location.hash.slice(1));
  let saved=null; try{ saved=JSON.parse(store.get('view')||'null'); }catch(e){}
  if(DISTRICTS.some(x=>x.d===hashD)) jumpTo(hashD);
  else if(saved&&saved.s){ [view.cx,view.cy]=toXY(saved.lon,saved.lat); view.s=saved.s; viewChanged(); }
  else jumpTo(DISTRICTS.some(x=>x.d===7)?7:DISTRICTS[0].d);
  window.addEventListener('hashchange',()=>{ const d=parseInt(location.hash.slice(1)); if(d) jumpTo(d); });
}
const themeChanged=()=>{ readColors(); if(dayCache){ renderList(); draw(); } };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeChanged);
new MutationObserver(themeChanged).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
init();
</script>
