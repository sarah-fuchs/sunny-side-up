name: Build data and deploy

on:
  workflow_dispatch:
    inputs:
      districts:
        description: "District numbers, space separated. Empty = all 23. 'missing' = only districts without data yet."
        required: false
        default: ""
  schedule:
    - cron: "17 3 1 * *"   # monthly, 1st of the month 03:17 UTC
  push:
    branches: [main]
    paths: ["web/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  data:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pipeline
        timeout-minutes: 300
        env:
          DISTRICTS: ${{ github.event.inputs.districts }}
        run: |
          if [ "$DISTRICTS" = "missing" ]; then
            python pipeline/build.py --missing
          else
            python pipeline/build.py $DISTRICTS
          fi
      - name: Commit data
        if: always()   # keep every district that was built, even if the run failed or timed out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Update district data"
          git pull --rebase origin main
          git push

  deploy:
    needs: data
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: pages
        uses: actions/deploy-pages@v4
